services:
  work-office:
    build:
      context: .
      dockerfile: Dockerfile
    image: work-office:latest
    container_name: work-office
    restart: unless-stopped
    ports:
      - "${OFFICE_DOCKER_BIND:-0.0.0.0}:4310:4310"
    environment:
      - NODE_ENV=production
      - OFFICE_HOST=0.0.0.0
      - OFFICE_PORT=4310
      - OFFICE_DOCKER=1
      - OFFICE_WIFI_SSID=${OFFICE_WIFI_SSID:-*}
      - OFFICE_HOST_BRIDGE=http://host.docker.internal:4311
      - WORK_OFFICE_NATIVE_BIN=/usr/local/bin/work-office-native
      - TZ=Asia/Ho_Chi_Minh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./server:/app/server
      - ./src:/app/src
      - ./app:/app/app
      - ./public:/app/public
      - ./.next:/app/.next
      - ${USERPROFILE:-~}/.gemini:/root/.gemini
      - ${USERPROFILE:-~}/.gemini:/home/node/.gemini
      - ${OFFICE_HOST_DRIVE:-E:/}:/mnt/e

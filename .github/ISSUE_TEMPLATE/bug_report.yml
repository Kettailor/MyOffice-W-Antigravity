name: Báo lỗi · Bug Report
description: Báo cáo lỗi xảy ra khi sử dụng MyOffice-W-Antigravity
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi (What happened?)
      description: Mô tả rõ bước bạn đã thực hiện, kết quả mong đợi và lỗi thực tế xảy ra.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Môi trường (OS, Node.js, Browser, Agent)
      placeholder: "Windows 11 / Node v22 / Chrome / Google Antigravity"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Kết quả chạy `node bin/cli.mjs doctor`
      render: shell
      description: Dán kết quả đầu ra của lệnh doctor (nhớ xóa thông tin nhạy cảm nếu có).
